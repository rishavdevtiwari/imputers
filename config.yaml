# =============================================================================
# Crop Profit & Risk Advisor - central configuration
# All thresholds, weights, and parameters live here so the pipeline is
# config-driven and reusable across districts/crops without code changes.
# =============================================================================

project:
  name: "Crop Profit & Risk Advisor"
  default_season: "summer"      # summer | winter | monsoon
  currency: "NPR"

# --- Data sources -----------------------------------------------------------
sources:
  nasa_power:
    base_url: "https://power.larc.nasa.gov/api/temporal/daily/point"
    parameters: ["T2M_MAX", "T2M_MIN", "T2M", "PRECTOTCORR", "RH2M"]
    community: "AG"
    start_year: 2005
    end_year: 2024
    fill_value: -999            # NASA POWER missing-data sentinel
  soilgrids:
    base_url: "https://rest.isric.org/soilgrids/v2.0/properties/query"
    properties: ["phh2o", "nitrogen", "soc", "clay", "sand", "silt"]
  kalimati:
    note: "Daily wholesale prices (Kathmandu). Cache history offline."
  yield:
    note: "MoALD district yields + FAOSTAT. Impute gaps by agro-eco zone."

# --- Data Quality Index (DQI) -----------------------------------------------
dqi:
  weights:                      # must sum to 1.0
    completeness: 0.25
    validity: 0.25
    consistency: 0.25
    uniqueness: 0.25
  target_score: 90.0            # CI gate / acceptance threshold

# --- Validation ranges (used by quality + validity scoring) -----------------
validation:
  soil_ph: [3.0, 9.0]
  temp_c: [-10.0, 50.0]
  rainfall_mm: [0.0, 5000.0]
  yield_kg_ha: [0.0, 100000.0]
  price_npr_kg: [0.0, 1000.0]

# --- Agro-ecological zones (used for KNN yield imputation grouping) ---------
agro_zones: ["Terai", "Hill", "Mountain"]

# --- Crop parameters --------------------------------------------------------
# potential_yield_kg_ha: agronomic ceiling under good management
# cost_npr_ha: indicative cost of cultivation (seed+fertilizer+labour+irrigation)
crops:
  rice:        { tbase_c: 10, maturity_gdd: 2200, potential_yield_kg_ha: 5000, cost_npr_ha: 90000 }
  maize:       { tbase_c: 10, maturity_gdd: 2600, potential_yield_kg_ha: 6000, cost_npr_ha: 80000 }
  wheat:       { tbase_c: 5,  maturity_gdd: 2000, potential_yield_kg_ha: 4000, cost_npr_ha: 70000 }
  millet:      { tbase_c: 8,  maturity_gdd: 1800, potential_yield_kg_ha: 1500, cost_npr_ha: 40000 }
  potato:      { tbase_c: 7,  maturity_gdd: 1700, potential_yield_kg_ha: 20000, cost_npr_ha: 150000 }
  tomato:      { tbase_c: 10, maturity_gdd: 1600, potential_yield_kg_ha: 30000, cost_npr_ha: 200000 }
  cauliflower: { tbase_c: 8,  maturity_gdd: 1500, potential_yield_kg_ha: 22000, cost_npr_ha: 160000 }
  cabbage:     { tbase_c: 7,  maturity_gdd: 1500, potential_yield_kg_ha: 25000, cost_npr_ha: 150000 }
  onion:       { tbase_c: 8,  maturity_gdd: 1900, potential_yield_kg_ha: 18000, cost_npr_ha: 140000 }
  lentil:      { tbase_c: 5,  maturity_gdd: 1400, potential_yield_kg_ha: 1200, cost_npr_ha: 45000 }

# --- Abiotic stress thresholds ----------------------------------------------
stress:
  drought_rainfall_ratio: 0.6   # season rainfall < 60% of crop need => drought flag
  frost_temp_c: 2.0             # min temp below this during cycle => frost risk
  heat_temp_c: 35.0             # max temp above this at flowering => heat stress

# --- Decision engine --------------------------------------------------------
monte_carlo:
  iterations: 5000
  price_volatility_floor: 0.05  # min relative std if history is thin
  failure_loss_threshold: 0.5   # >50% total yield loss counts as "crop failure"
  seed: 42

decision:
  baseline_crop: "potato"       # what the persona (Suchit) plants by default
  rank_by: "risk_adjusted_profit"  # profit / (1 + failure_risk)
